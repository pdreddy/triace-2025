[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_FIREBASE_API_KEY = "AIzaSyAhPI82OCN82Ms5kQlIl5LqetILRStZ2uk"
  VITE_FIREBASE_AUTH_DOMAIN = "multiclub-890ea.firebaseapp.com"
  VITE_FIREBASE_DATABASE_URL = "https://multiclub-890ea-default-rtdb.firebaseio.com"
  VITE_FIREBASE_PROJECT_ID = "multiclub-890ea"
  VITE_FIREBASE_STORAGE_BUCKET = "multiclub-890ea.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "132448818376"
  VITE_FIREBASE_APP_ID = "1:132448818376:web:3d2be4c67565030d5181fd"
  VITE_ADMIN_USERNAME = "reddi2026"
  VITE_USE_EMULATORS = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service worker and manifest must always be revalidated so updates reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Hashed build files never change, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
